[package]
name = "vellum"
version = "1.0.0"
authors = ["greyxp1 <greyxp999@gmail.com>"]
edition = "2024"
description = "Live screen annotation overlay for Wayland"
repository = "https://github.com/greyxp1/vellum"
license = "MIT AND ISC"
keywords = ["wayland", "annotation"]

[workspace]
members = [".", "xtask"]
default-members = ["."]

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
color = "0.3.3"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }

clap.workspace = true

wayland-client = "0.31.11"
# layer shell
wayland-protocols-wlr = { version = "0.3.9", features = ["client"] }
# Wayland protocol extensions
wayland-protocols = { version = "0.32.13", features = [
    "client",
    "staging",
    "unstable",
] }
# Provides the libwayland object pointers required to create the Vulkan surface.
wayland-backend = { version = "0.3.11", features = ["client_system"] }

wgpu = { version = "29.0.0", default-features = false, features = [
    "std",
    "parking_lot",
    "vulkan",
    "wgsl",
] }
pollster = "0.4.0"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
gbm = { version = "0.18.0", default-features = false }
memmap2 = "0.9.11"
parley = { version = "0.11.1", features = ["complex-scripts"] }
glifo = { version = "0.3.0", features = ["png"] }
skrifa = "0.44.0"
vello_common = { version = "0.2.0", features = ["png"] }
vello_hybrid = { version = "0.2.0", default-features = false, features = ["std", "wgpu", "text"] }
color.workspace = true
peniko = { version = "0.6.1", default-features = false }
unicode-segmentation = "1.13.3"
xkbcommon = "0.9.0"
rustix = { version = "1.1.2", features = ["event", "fs", "net", "process"] }

kurbo = "0.13.1"
perfect_freehand = "0.1.1"

[build-dependencies]
clap.workspace = true
clap_complete = "4.6.9"
clap_complete_nushell = "4.6.2"
clap_mangen = "0.3.0"
color.workspace = true
